optical_flow_computation:
  ros__parameters:
    image_topic: "/multisense/left/image_rect"
    optical_flow_topic: "/multisense/perception_pipeline/optical_flow"
    pyr_scale: 0.5
    levels: 6
    winsize: 15
    iterations: 10
    poly_n: 5
    poly_sigma: 1.5
    flags: 0

visual_odometry_node:
  ros__parameters:
    color_image_topic: "/multisense/left/image_rect"
    depth_image_topic: "/multisense/left/openni_depth"
    camera_info_topic: "/multisense/left/depth/camera_info"
    odometry_debug_topic: "/multisense/debug/odometry_keypoints"
    camera_frame_tf_topic: "/multisense/perception_pipeline/camera_frame_tf"
    max_depth_odom: 20.0
    min_depth_odom: 0.1
    odometry_debug_image: true
    frame_id: "multisense/left_camera_optical_frame"

kalman_filter_node:
  ros__parameters:
    optical_flow_topic: "/multisense/perception_pipeline/optical_flow"
    depth_topic: "/multisense/left/openni_depth"
    camera_info_topic: "/multisense/left/depth/camera_info"
    camera_frame_tf_topic: "/multisense/perception_pipeline/camera_frame_tf"
    color_image_topic: "/multisense/left/image_rect"
    debug_image_topic_: "/multisense/debug/debug_image"  # If your node code uses this exact param name
    output_6d_topic: "/multisense/perception_pipeline/output_6d"
    debug_markers_topic: "/multisense/debug/image_6d_markers"
    frame_id: "/multisense/left_camera_optical_frame"
    grid_size: 15
    debug_image_grid: false
    use_ego_motion: true
    use_ego_var: true
    sigma2_x_system: 10.0
    sigma2_y_system: 10.0
    sigma2_z_system: 0.1
    sigma2_flow_y_measurement: 3.0
    sigma2_flow_x_measurement: 3.0
    sigma2_depth_system: 0.5
    sigma2_tx_measurement: 10.0
    sigma2_ty_measurement: 10.0
    sigma2_tz_measurement: 10.0
    sigma2_theta_measurement: 10.0
    sigma2_psi_system: 10.0
    min_depth: 2.0
    max_depth: 20.0
    min_height_: -2.0
    max_height: 4.0


object_detector_node:
  ros__parameters:
    input_6d_topic: "/multisense/perception_pipeline/output_6d"
    output_markers_topic: "/multisense/perception_pipeline/output_markers"
    output_clusters_topic: "/multisense/perception_pipeline/output_clusters"
    frame_id: "/multisense/multisense/left_camera_optical_frame"
    eps: 0.1
    minPts: 10
    pos_weight: 0.045
    vel_weight: 1.0
    vel_threshold: 0.5



