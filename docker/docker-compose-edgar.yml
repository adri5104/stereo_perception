
services:
  stereo_perception_bridge_multisense:
    image: gitlab.lrz.de:5005/teleoperiertes_fahren/research_brecht/stereo_perception/stereo_perception_bridge:1.0.0
    container_name: stereo_perception_bridge
    network_mode: "host"
    stdin_open: true
    tty: true
    volumes:
      - ./stereo_perception_edgar_bridge/config:/home/ubuntu/config
      - "/dev/shm:/dev/shm"
      - "../config/dds/:/home/ubuntu/ros2_ws/config/dds/"
    environment:
      - ROS_DOMAIN_ID=${ROS_Domain_ID}
      - CYCLONEDDS_URI=file:///home/ubuntu/ros2_ws/config/dds/${dds}.xml
    command:
      - bash
      - -c
      - >
          ros2 launch stereo_perception_edgar_bridge stereo_perception_bridge_container.launch.py

  perception_pipeline_multisense:
    image: gitlab.lrz.de:5005/teleoperiertes_fahren/research_brecht/stereo_perception/perception_pipeline:1.0.0
    container_name: perception_pipeline
    network_mode: "host"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    stdin_open: true
    tty: true
    volumes:
      - ./perception_pipeline/carnegie/config:/home/ubuntu/config
      - "/dev/shm:/dev/shm"
      - "../config/dds/:/home/ubuntu/perception_pipeline_ws/config/dds/"
    environment:
      - ROS_DOMAIN_ID=${ROS_Domain_ID}
      - CYCLONEDDS_URI=file:///home/ubuntu/perception_pipeline_ws/config/dds/${dds}.xml
    command:
      - bash
      - -c
      - >
          ros2 launch perception_pipeline_launch launch_pipeline_container.launch.py

  criticallity_pipeline_multisense:
    image: gitlab.lrz.de:5005/teleoperiertes_fahren/research_brecht/stereo_perception/criticallity_pipeline:1.0.0
    container_name: criticallity_pipeline
    network_mode: "host"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    stdin_open: true
    tty: true
    volumes:
      - ./criticallity_pipeline/carnegie/config:/home/ubuntu/config
      - "/dev/shm:/dev/shm"
      - "../config/dds/:/home/ubuntu/criticallity_pipeline_ws/config/dds/"
    environment:
      - ROS_DOMAIN_ID=${ROS_Domain_ID}
      - CYCLONEDDS_URI=file:///home/ubuntu/criticallity_pipeline_ws/config/dds/${dds}.xml
    command:
      - bash
      - -c
      - >
          ros2 launch criticallity_pipeline_launch criticallity_pipeline_container.launch.py