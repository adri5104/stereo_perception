
services:
  perception_pipeline:

    image: gitlab.lrz.de:5005/teleoperiertes_fahren/research_brecht/stereo_perception/perception_pipeline:deploy
    container_name: perception_pipeline
    network_mode: "host"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # Allocate a TTY and keep stdin open (like -it in docker run)
    stdin_open: true
    tty: true

    volumes:
      - ./scripts/docker/dk_perception_pipeline/deploy_image/config:/home/ubuntu/config
      - "/dev/shm:/dev/shm"
      - "./config/dds/:/home/ubuntu/perception_pipeline_ws/config/dds/"
    environment:
      - ROS_DOMAIN_ID=${ROS_Domain_ID}
      - CYCLONEDDS_URI=file:///home/ubuntu/perception_pipeline_ws/config/dds/${dds}.xml