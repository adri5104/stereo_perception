
services:
  stereo_perception_bridge_multisense:
    image: gitlab.lrz.de:5005/teleoperiertes_fahren/research_brecht/stereo_perception/stereo_perception_edgar_bridge:1.0.0
    container_name: stereo_perception_bridge_compose
    network_mode: "host"
    stdin_open: true
    tty: true
    pid: "host"
    ipc: "host"
    volumes:
      - "./stereo_perception_edgar_bridge/config:/home/ubuntu/config"
      - "/dev/shm:/dev/shm"
      - "../config/dds/:/home/ubuntu/ros2_ws/config/dds/"
      - "/sys/kernel/debug:/sys/kernel/debug"
    command:
      - bash
      - -c
      - >
          ros2 launch stereo_perception_edgar_bridge stereo_perception_bridge_container.launch.py

  perception_pipeline_multisense:
    image: gitlab.lrz.de:5005/teleoperiertes_fahren/research_brecht/stereo_perception/perception_pipeline:1.1.0
    container_name: perception_pipeline_compose
    network_mode: "host"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    stdin_open: true
    tty: true
    volumes:
      - ./perception_pipeline/config/carnegie:/home/ubuntu/config
      - "/dev/shm:/dev/shm"
      - "../config/dds/:/home/ubuntu/ros2_ws/config/dds/"
    command:
      - bash
      - -c
      - >
          ros2 launch perception_pipeline_launch perception_pipeline_container.launch.py


  criticallity_pipeline_multisense:
    image: gitlab.lrz.de:5005/teleoperiertes_fahren/research_brecht/stereo_perception/criticallity_pipeline:1.1.0
    container_name: criticallity_pipeline_compose
    network_mode: "host"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    stdin_open: true
    tty: true
    volumes:
      - "../non_ros/ttc_comparison/ttc_logs_sp/:/home/ubuntu/ttc_logs"
      - "./criticallity_pipeline/config/carnegie:/home/ubuntu/config"
      - "/dev/shm:/dev/shm"
      - "../config/dds/:/home/ubuntu/ros2_ws/config/dds/"
    command:
      - bash
      - -c
      - >
          ros2 launch criticallity_pipeline_launch criticallity_pipeline_container.launch.py

  criticallity_pipeline_autoware:
    image: gitlab.lrz.de:5005/teleoperiertes_fahren/research_brecht/stereo_perception/criticallity_pipeline_autoware:1.0.0
    container_name: criticallity_pipeline_autoware
    network_mode: "host"
    stdin_open: true
    tty: true
    volumes:
      - ./criticallity_pipeline_autoware/config:/home/ubuntu/config
      - ../non_ros/ttc_comparison/ttc_logs_autoware/:/home/ubuntu/ttc_logs
      - "/dev/shm:/dev/shm"
      - "../config/dds/:/home/ubuntu/ros2_ws/config/dds/"
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    command:
      - bash
      - -c
      - > 
          echo "###########################################################" &&
          echo "# Starting autoware bridge node and critiallity_pipeline  #" &&
          echo "###########################################################" &&
          echo "" &&
          ros2 launch criticallity_pipeline_launch criticallity_pipeline_autoware_container.launch.py &
          ros2 launch stereo_perception_autoware_bridge stereo_perception_autoware_bridge_container.launch.py 